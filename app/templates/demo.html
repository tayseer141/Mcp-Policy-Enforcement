<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} — MCP Policy Enforcement</title>
  <style>
    /* ===== Theme variables (matched to /admin) ===== */
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #273449;
      --muted: #94a3b8;
      --text: #e2e8f0;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --ok: #22c55e;
      --ok-soft: rgba(34, 197, 94, 0.15);
      --warn: #f59e0b;
      --deny: #ef4444;
      --deny-soft: rgba(239, 68, 68, 0.15);
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ===== Topbar (matches admin) ===== */
    header.topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    header.topbar .brand { font-weight: 600; letter-spacing: 0.2px; }
    header.topbar .brand small { color: var(--muted); font-weight: 400; margin-left: 8px; }
    header.topbar .session { color: var(--muted); font-size: 13px; }

    main.content { padding: 24px; max-width: 980px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 8px 0; font-weight: 600; }
    p.lede { color: var(--muted); margin: 0 0 4px 0; }
    p.api-hint { color: var(--muted); font-size: 12px; margin: 0 0 24px 0; }
    p.api-hint code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--panel-2);
      padding: 1px 6px;
      border-radius: 4px;
      color: var(--text);
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 18px;
    }

    /* ===== Sample-prompt chips ===== */
    .field-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    .sample-prompts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }
    .prompt-chip {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s, background 0.15s;
    }
    .prompt-chip:hover { border-color: var(--accent); background: var(--accent-soft); }
    .prompt-chip.danger { color: #fda4af; border-color: rgba(239, 68, 68, 0.35); }
    .prompt-chip.danger:hover { background: var(--deny-soft); border-color: var(--deny); }

    /* ===== Form ===== */
    .form-row { margin-bottom: 16px; }
    .form-row label.input-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    select, textarea {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }
    select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    textarea { min-height: 100px; resize: vertical; }

    .permission-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .perm-chip {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      background: var(--ok-soft);
      color: var(--ok);
      border: 1px solid rgba(34, 197, 94, 0.35);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .perm-chip.empty {
      background: var(--deny-soft);
      color: var(--deny);
      border-color: rgba(239, 68, 68, 0.35);
    }

    button.btn {
      background: var(--accent);
      color: #0b1220;
      border: 0;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
    }
    button.btn:hover { filter: brightness(1.05); }
    button.btn[disabled] { opacity: 0.6; cursor: progress; }

    /* ===== Decision badge ===== */
    .decision-badge {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      border-radius: 10px;
      margin-bottom: 18px;
    }
    .decision-badge.allow {
      background: linear-gradient(90deg, var(--ok-soft), transparent);
      border-left: 4px solid var(--ok);
    }
    .decision-badge.deny {
      background: linear-gradient(90deg, var(--deny-soft), transparent);
      border-left: 4px solid var(--deny);
    }
    .decision-icon {
      width: 44px; height: 44px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 700;
      flex-shrink: 0;
    }
    .decision-badge.allow .decision-icon { background: var(--ok); color: #052e13; }
    .decision-badge.deny  .decision-icon { background: var(--deny); color: #4c0519; }
    .decision-text { display: flex; flex-direction: column; gap: 2px; }
    .decision-label { font-size: 18px; font-weight: 700; letter-spacing: 0.04em; }
    .decision-stage {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .decision-badge.allow .decision-label { color: var(--ok); }
    .decision-badge.deny  .decision-label { color: var(--deny); }

    /* ===== Pipeline strip ===== */
    .pipeline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 16px 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 18px;
      overflow-x: auto;
    }
    .pipe-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      min-width: 88px;
      opacity: 0;
      transform: translateY(2px);
      animation: pipeFadeIn 0.35s ease forwards;
    }
    .pipe-step:nth-child(1) { animation-delay: 0.00s; }
    .pipe-step:nth-child(3) { animation-delay: 0.12s; }
    .pipe-step:nth-child(5) { animation-delay: 0.24s; }
    .pipe-step:nth-child(7) { animation-delay: 0.36s; }
    .pipe-step:nth-child(9) { animation-delay: 0.48s; }
    @keyframes pipeFadeIn { to { opacity: 1; transform: none; } }

    .pipe-icon {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 700;
      border: 2px solid var(--border);
      background: var(--panel);
      color: var(--muted);
    }
    .pipe-label {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.02em;
      max-width: 84px;
    }
    .pipe-line {
      flex: 1;
      height: 2px;
      background: var(--border);
      min-width: 14px;
      align-self: center;
      margin-top: -16px;
    }

    .pipe-step.ok .pipe-icon {
      background: var(--ok); border-color: var(--ok); color: #052e13;
    }
    .pipe-step.ok .pipe-label { color: var(--text); }
    .pipe-line.ok { background: var(--ok); }

    .pipe-step.fail .pipe-icon {
      background: var(--deny); border-color: var(--deny); color: #4c0519;
      animation: pulseFail 1.4s ease infinite;
    }
    .pipe-step.fail .pipe-label { color: var(--deny); font-weight: 600; }
    @keyframes pulseFail {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.45); }
      50%      { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
    }

    .pipe-step.skip .pipe-icon { opacity: 0.45; }
    .pipe-step.skip .pipe-label { opacity: 0.45; }
    .pipe-line.skip { opacity: 0.4; }

    .pipe-step.running .pipe-icon {
      border-color: var(--accent);
      color: var(--accent);
      animation: pulseRun 1.1s ease infinite;
    }
    @keyframes pulseRun {
      0%, 100% { box-shadow: 0 0 0 0 var(--accent-soft); }
      50%      { box-shadow: 0 0 0 6px transparent; }
    }

    /* ===== Answer / error panels ===== */
    .answer {
      background: var(--ok-soft);
      border: 1px solid rgba(34, 197, 94, 0.35);
      border-left: 4px solid var(--ok);
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 14px;
    }
    .answer-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--ok); font-weight: 700; margin-bottom: 6px;
    }
    .answer-text { font-size: 15px; line-height: 1.55; color: var(--text); white-space: pre-wrap; }

    .error-panel {
      background: var(--deny-soft);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-left: 4px solid var(--deny);
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 14px;
    }
    .error-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--deny); font-weight: 700; margin-bottom: 6px;
    }
    .error-text { font-size: 14px; line-height: 1.55; color: var(--text); white-space: pre-wrap; }

    /* ===== Collapsibles ===== */
    details.raw-output, details.meta-details {
      margin-top: 12px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }
    details.raw-output summary, details.meta-details summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      user-select: none;
      list-style: none;
    }
    details.raw-output summary::-webkit-details-marker,
    details.meta-details summary::-webkit-details-marker { display: none; }
    details.raw-output summary::before,
    details.meta-details summary::before {
      content: "▸";
      display: inline-block;
      margin-right: 6px;
      transition: transform 0.15s;
    }
    details[open] summary::before { transform: rotate(90deg); }
    details.raw-output pre {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      margin-top: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-x: auto;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 8px 16px;
      margin-top: 12px;
      font-size: 13px;
    }
    .meta-grid .key { color: var(--muted); }
    .meta-grid code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: var(--text);
      background: var(--bg);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .transport-error {
      padding: 12px 16px;
      background: var(--deny-soft);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 8px;
      color: var(--text);
    }

    /* Tabular rendering of structured tool output (e.g. employee lists) */
    .result-table-wrap { margin: 14px 0 4px; }
    .result-table-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); margin-bottom: 6px;
    }
    table.data-table {
      width: 100%; border-collapse: collapse; font-size: 13px;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden;
    }
    table.data-table th, table.data-table td {
      text-align: left; padding: 8px 11px;
      border-bottom: 1px solid var(--border);
    }
    table.data-table th {
      background: var(--panel-2); color: var(--muted);
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
      font-weight: 500;
    }
    table.data-table tbody tr:last-child td { border-bottom: none; }
    table.data-table tbody tr:hover td { background: rgba(255, 255, 255, 0.02); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      MCP Policy Enforcement
      <small>secure console</small>
    </div>
    <div class="session">
      <a href="/admin">↗ admin dashboard</a>
    </div>
  </header>

  <main class="content">
    <h1>Secure Console</h1>

    <div class="card">
      <form id="execute-form">
        <div class="form-row">
          <label class="input-label" for="username">User</label>
          <select name="username" id="username" required>
            {% for u in users %}
              <option value="{{ u.username }}">
                {{ u.username }}{% if u.role %} — {{ u.role }}{% endif %}
              </option>
            {% endfor %}
          </select>
          <div class="permission-preview" id="permission-preview"></div>
        </div>

        <div class="form-row">
          <label class="input-label" for="prompt">Natural-language request</label>
          <textarea name="prompt" id="prompt" placeholder="e.g. Show all employees" required></textarea>
        </div>

        <button type="submit" class="btn" id="submit-btn">Run secure request</button>
      </form>
    </div>

    <div id="result-container"></div>
  </main>

  {# Server-rendered user data, including the permissions of each user's
     role. The JS reads this to render the permission-preview chips on
     dropdown change. tojson handles JSON encoding + HTML escaping. #}
  <script id="users-data" type="application/json">{{ users|tojson|safe }}</script>

  <script>
  (function () {
    // ============ Data bootstrap ============
    const usersData = JSON.parse(document.getElementById("users-data").textContent || "[]");
    const usersByName = {};
    for (const u of usersData) usersByName[u.username] = u;

    const form = document.getElementById("execute-form");
    const usernameSelect = document.getElementById("username");
    const promptInput = document.getElementById("prompt");
    const submitBtn = document.getElementById("submit-btn");
    const resultContainer = document.getElementById("result-container");
    const permPreview = document.getElementById("permission-preview");

    // ============ Helpers ============
    function escapeHtml(s) {
      if (s === null || s === undefined) return "";
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // ============ Permission preview ============
    function renderPermissions() {
      const u = usersByName[usernameSelect.value];
      if (!u) { permPreview.innerHTML = ""; return; }
      const role = u.role || "no role";
      const perms = u.permissions || [];
      let chipsHtml;
      if (perms.length === 0) {
        chipsHtml = '<span class="perm-chip empty">no permissions</span>';
      } else {
        chipsHtml = perms.map(p => `<span class="perm-chip">${escapeHtml(p)}</span>`).join("");
      }
      permPreview.innerHTML = `
        <span>Role <strong style="color: var(--text);">${escapeHtml(role)}</strong> grants:</span>
        ${chipsHtml}
      `;
    }
    usernameSelect.addEventListener("change", renderPermissions);
    renderPermissions();

    // ============ Pipeline strip ============
    const STAGES = [
      { key: "tool-selection", label: "Tool Selection" },
      { key: "rbac",            label: "RBAC Check"     },
      { key: "intent",          label: "Intent Align"   },
      { key: "policy",          label: "Policy Engine"  },
      { key: "execution",       label: "Tool Execute"   },
    ];

    function pipelineStates(decision, failingStage) {
      // ALLOW: every stage passed.
      if (decision === "ALLOW") {
        return STAGES.map(s => ({ ...s, status: "ok" }));
      }
      // Map server stage to pipeline index.
      // "system" errors happen at the execution step.
      const failKey = failingStage === "system" ? "execution" : failingStage;
      let failIdx = STAGES.findIndex(s => s.key === failKey);
      if (failIdx < 0) failIdx = STAGES.length - 1;

      return STAGES.map((s, i) => ({
        ...s,
        status: i < failIdx ? "ok" : (i === failIdx ? "fail" : "skip"),
      }));
    }

    function buildPipelineHtml(states) {
      const parts = [];
      states.forEach((s, i) => {
        const icon =
          s.status === "ok"      ? "✓" :
          s.status === "fail"    ? "✗" :
          s.status === "running" ? "·" : "·";
        parts.push(`
          <div class="pipe-step ${s.status}" title="${escapeHtml(s.label)} — ${escapeHtml(s.status)}">
            <div class="pipe-icon">${icon}</div>
            <div class="pipe-label">${escapeHtml(s.label)}</div>
          </div>
        `);
        if (i < states.length - 1) {
          // The line takes the status of the *next* step so it dims when the next step is skipped.
          const lineCls = states[i + 1].status === "ok" ? "ok"
                        : states[i + 1].status === "skip" ? "skip" : "";
          parts.push(`<div class="pipe-line ${lineCls}"></div>`);
        }
      });
      return `<div class="pipeline">${parts.join("")}</div>`;
    }

    function buildLoadingPipelineHtml() {
      const states = STAGES.map(s => ({ ...s, status: "running" }));
      return buildPipelineHtml(states);
    }

    // ============ Result rendering ============
    function stageDisplayLabel(stage) {
      const m = {
        "success":         "all stages passed",
        "rbac":            "blocked at RBAC",
        "intent":          "blocked at intent alignment",
        "policy":          "blocked by policy rule",
        "tool-selection":  "no matching tool",
        "system":          "execution error",
      };
      return m[stage] || stage || "unknown";
    }

    // --- Tabular rendering of structured tool output --------------------
    function isPlainObject(v) {
      return v !== null && typeof v === "object" && !Array.isArray(v);
    }

    function formatCell(v) {
      if (v === null || v === undefined) return "—";
      if (typeof v === "object") return JSON.stringify(v);
      return String(v);
    }

    // Render a table when the tool output is tabular:
    //   * a non-empty array of flat objects (e.g. a list of employees), or
    //   * a single flat object (e.g. one employee record).
    // Returns "" for anything else, so non-tabular results fall back to the
    // natural-language answer + raw JSON.
    function buildTableHtml(output) {
      let rows = null;
      if (Array.isArray(output) && output.length && output.every(isPlainObject)) {
        rows = output;
      } else if (isPlainObject(output) &&
                 Object.values(output).every(v => typeof v !== "object" || v === null)) {
        rows = [output];
      }
      if (!rows) return "";

      const cols = [];
      rows.forEach(r => Object.keys(r).forEach(k => { if (!cols.includes(k)) cols.push(k); }));
      const head = cols.map(c => `<th>${escapeHtml(c)}</th>`).join("");
      const body = rows.map(r =>
        `<tr>${cols.map(c => `<td>${escapeHtml(formatCell(r[c]))}</td>`).join("")}</tr>`
      ).join("");

      const count = rows.length;
      const label = count === 1 ? "1 record" : `${count} records`;
      return `
        <div class="result-table-wrap">
          <div class="result-table-label">Results — ${label}</div>
          <table class="data-table">
            <thead><tr>${head}</tr></thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      `;
    }

    function renderResult(data) {
      const isAllow = data.policy_decision === "ALLOW";
      const decisionCls = isAllow ? "allow" : "deny";
      const decisionIcon = isAllow ? "✓" : "✗";

      const pipelineHtml = buildPipelineHtml(
        pipelineStates(data.policy_decision, data.authorization_stage)
      );

      let outcomeHtml = "";
      if (isAllow) {
        if (data.human_summary) {
          outcomeHtml += `
            <div class="answer" dir="auto">
              <div class="answer-label">Answer</div>
              <div class="answer-text">${escapeHtml(data.human_summary)}</div>
            </div>
          `;
        }
        // Structured table (when the result is a list/record of fields).
        outcomeHtml += buildTableHtml(data.tool_output);
        const rawJson = JSON.stringify(data.tool_output, null, 2);
        outcomeHtml += `
          <details class="raw-output">
            <summary>Raw tool output (JSON)</summary>
            <pre>${escapeHtml(rawJson)}</pre>
          </details>
        `;
      } else {
        outcomeHtml = `
          <div class="error-panel" dir="auto">
            <div class="error-label">Reason</div>
            <div class="error-text">${escapeHtml(data.error_message || "(no reason returned)")}</div>
          </div>
        `;
      }

      const argsJson = JSON.stringify(data.arguments || {}, null, 2);
      const metaHtml = `
        <details class="meta-details">
          <summary>Request details</summary>
          <div class="meta-grid">
            <div class="key">User</div>       <div>${escapeHtml(data.username)}</div>
            <div class="key">Prompt</div>     <div dir="auto">${escapeHtml(data.prompt)}</div>
            <div class="key">Tool chosen</div><div><code>${escapeHtml(data.tool_name || "(none)")}</code></div>
            <div class="key">Arguments</div>  <div><code>${escapeHtml(argsJson)}</code></div>
            <div class="key">Stage</div>      <div>${escapeHtml(data.authorization_stage)}</div>
          </div>
        </details>
      `;

      resultContainer.innerHTML = `
        <div class="card">
          <div class="decision-badge ${decisionCls}">
            <div class="decision-icon">${decisionIcon}</div>
            <div class="decision-text">
              <div class="decision-label">${escapeHtml(data.policy_decision)}</div>
              <div class="decision-stage">${escapeHtml(stageDisplayLabel(data.authorization_stage))}</div>
            </div>
          </div>
          ${pipelineHtml}
          ${outcomeHtml}
          ${metaHtml}
        </div>
      `;
    }

    function renderTransportError(message) {
      resultContainer.innerHTML = `
        <div class="card">
          <div class="transport-error">
            <strong>Request failed:</strong> ${escapeHtml(message)}
          </div>
        </div>
      `;
    }

    function renderLoading() {
      resultContainer.innerHTML = `
        <div class="card">
          <div class="decision-badge" style="background: var(--accent-soft); border-left-color: var(--accent);">
            <div class="decision-icon" style="background: var(--accent); color: #062537;">…</div>
            <div class="decision-text">
              <div class="decision-label" style="color: var(--accent);">Running</div>
              <div class="decision-stage">passing through the policy pipeline</div>
            </div>
          </div>
          ${buildLoadingPipelineHtml()}
        </div>
      `;
    }

    // ============ Submit handler ============
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        username: usernameSelect.value,
        prompt: promptInput.value,
      };
      submitBtn.disabled = true;
      submitBtn.textContent = "Running…";
      renderLoading();

      try {
        const response = await fetch("/api/v1/execute", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          let detail = `HTTP ${response.status}`;
          try {
            const errBody = await response.json();
            if (errBody && errBody.detail) detail += ` — ${JSON.stringify(errBody.detail)}`;
          } catch (_) { /* non-JSON */ }
          renderTransportError(detail);
          return;
        }

        const data = await response.json();
        renderResult(data);

      } catch (err) {
        renderTransportError(err.message || String(err));
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Run secure request";
      }
    });
  })();
  </script>
</body>
</html>

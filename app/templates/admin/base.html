<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ title }} — MCP Policy Enforcement</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #273449;
      --muted: #94a3b8;
      --text: #e2e8f0;
      --accent: #38bdf8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --deny: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header.topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    header.topbar .brand {
      font-weight: 600;
      letter-spacing: 0.2px;
      color: var(--text);
    }
    header.topbar .brand small {
      color: var(--muted);
      font-weight: 400;
      margin-left: 8px;
    }
    header.topbar .session {
      color: var(--muted);
      font-size: 13px;
    }
    header.topbar .session strong { color: var(--text); }
    header.topbar form { display: inline; margin-left: 10px; }
    header.topbar button.logout {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    header.topbar button.logout:hover { color: var(--text); border-color: var(--muted); }

    nav.tabs {
      display: flex;
      gap: 2px;
      background: var(--panel);
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
    }
    nav.tabs a {
      padding: 10px 16px;
      color: var(--muted);
      border-bottom: 2px solid transparent;
    }
    nav.tabs a.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    main.content { padding: 24px; max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 20px 0; font-weight: 600; }
    h2 { font-size: 16px; margin: 28px 0 12px 0; font-weight: 600; color: var(--text); }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
    }
    .card .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .card .value { font-size: 28px; font-weight: 600; margin-top: 6px; }
    .card.allow .value { color: var(--ok); }
    .card.deny .value { color: var(--deny); }
    .card.stage .value { font-size: 20px; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th {
      background: var(--panel-2);
      color: var(--muted);
      font-weight: 500;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }

    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid transparent;
    }
    .pill.allow { background: rgba(34, 197, 94, 0.12); color: var(--ok); border-color: rgba(34, 197, 94, 0.35); }
    .pill.deny  { background: rgba(239, 68, 68, 0.12); color: var(--deny); border-color: rgba(239, 68, 68, 0.35); }
    .pill.stage { background: var(--panel-2); color: var(--text); border-color: var(--border); }

    code.mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: var(--muted);
      background: transparent;
      white-space: pre-wrap;
      word-break: break-word;
    }

    form.inline { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 16px; }
    form.inline label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 4px; }
    form.inline input, form.inline select {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      min-width: 140px;
    }
    form.inline button, .btn {
      background: var(--accent);
      color: #0b1220;
      border: 0;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    form.inline button.secondary, .btn.secondary {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      font-weight: 500;
    }

    .notice {
      padding: 10px 14px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--text);
      border-radius: 6px;
      margin-bottom: 16px;
    }
    .notice.error { background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.4); }

    .muted { color: var(--muted); }
    .center { text-align: center; }
    .right { text-align: right; }
    .nowrap { white-space: nowrap; }
    small.ts { color: var(--muted); font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  {% if admin_user %}
  <header class="topbar">
    <div class="brand">
      MCP Policy Enforcement
      <small>admin dashboard</small>
    </div>
    <div class="session">
      signed in as <strong>{{ admin_user.username }}</strong>
      <form method="post" action="/admin/logout">
        <button type="submit" class="logout">log out</button>
      </form>
    </div>
  </header>
  <nav class="tabs">
    <a href="/admin"            class="{% if active_tab == 'overview' %}active{% endif %}">Overview</a>
    <a href="/admin/audit"      class="{% if active_tab == 'audit' %}active{% endif %}">Audit log</a>
    <a href="/admin/users"      class="{% if active_tab == 'users' %}active{% endif %}">Users</a>
    <a href="/admin/roles"      class="{% if active_tab == 'roles' %}active{% endif %}">Roles</a>
    <a href="/admin/employees"  class="{% if active_tab == 'employees' %}active{% endif %}">Employees</a>
    <a href="/demo" style="margin-left:auto; color: var(--muted);">/demo ↗</a>
  </nav>
  {% endif %}

  <main class="content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
